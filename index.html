<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0284c7">
  
  <title>CARLOS P. GARCIA HIGH SCHOOL - ADM & Attendance</title>

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --header-blue: #0284c7;
      --navy-primary: #0f172a;
      --card-border: #bae6fd;
      --light-yellow: #fef08a;
    }

    html, body {
      width: 100%;
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      color: var(--navy-primary);
      -webkit-tap-highlight-color: transparent;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 10px 12px 30px 12px;
    }

    @media (min-width: 992px) {
      .app-container {
        max-width: 1200px;
        padding: 20px;
      }
    }

    .header-banner {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 50%, #0d9488 100%);
      color: white;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
      border-bottom: 4px solid var(--light-yellow);
      text-align: center;
    }

    .school-logo {
      height: 46px;
      margin-bottom: 6px;
    }

    .header-title-text h1 { font-size: 0.95rem; font-weight: 800; margin: 0; }
    .header-title-text h2 { font-size: 0.78rem; color: var(--light-yellow); font-weight: 700; margin: 2px 0 0 0; }

    .nav-tabs-container, .sub-nav-tabs {
      background: #e0f2fe;
      padding: 4px;
      border-radius: 12px;
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      border: 1px solid #bae6fd;
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      height: 44px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #0369a1;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--header-blue);
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.18);
    }

    .custom-card {
      background: #ffffff;
      border-radius: 14px;
      border: 1.5px solid var(--card-border);
      box-shadow: 0 3px 10px rgba(2, 132, 199, 0.05);
      padding: 14px;
      margin-bottom: 12px;
    }

    .form-section-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--header-blue);
      margin-bottom: 12px;
      border-bottom: 2px solid #e0f2fe;
      padding-bottom: 6px;
    }

    .digital-clock-box {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #38bdf8;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      margin-bottom: 12px;
    }

    .digital-clock-time { font-size: 1.6rem; font-weight: 800; font-family: monospace; }

    .form-control, .form-select {
      font-size: 0.95rem !important;
      min-height: 46px;
      border-radius: 10px;
      background-color: #f8fafc;
    }

    .btn-custom-blue { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: white; font-weight: 800; min-height: 46px; border: none; border-radius: 10px; }
    .btn-time-in { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); color: white; font-weight: 800; min-height: 46px; border: none; border-radius: 10px; }
    .btn-time-out { background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); color: white; font-weight: 800; min-height: 46px; border: none; border-radius: 10px; }

    .record-card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    /* Custom Modal Window Styling */
    .modal-content-custom {
      border: none;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.2);
      overflow: hidden;
    }

    .modal-status-icon-wrapper {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .modal-icon-success {
      background-color: #dcfce7;
      color: #16a34a;
    }

    .modal-icon-error {
      background-color: #fee2e2;
      color: #dc2626;
    }

    @media (min-width: 992px) {
      .sub-nav-tabs { display: none !important; }
      #admFormCol, #admLogsCol, #attFormCol, #attLogsCol { display: block !important; }
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- Header Banner -->
  <div class="header-banner">
    <img src="https://raw.githubusercontent.com/cpghs-305347/cpghs-new-logo/main/cpghs%20new%20logo.png" alt="CPGHS Logo" class="school-logo">
    <div class="header-title-text">
      <h1>CARLOS P. GARCIA HIGH SCHOOL</h1>
      <h2>ADM & Attendance System</h2>
    </div>
  </div>

  <!-- Primary Navigation -->
  <div class="nav-tabs-container">
    <button class="tab-btn active" id="tabAdmBtn" onclick="switchMainTab('adm')">
      <i class="bi bi-journal-text"></i> ADM System
    </button>
    <button class="tab-btn" id="tabTeacherBtn" onclick="switchMainTab('teacher')">
      <i class="bi bi-clock-history"></i> Attendance
    </button>
  </div>

  <!-- MODULE 1: ADM SYSTEM -->
  <div id="admTabContent">
    <div class="sub-nav-tabs d-flex d-lg-none">
      <button class="tab-btn active" id="subAdmFormBtn" onclick="switchAdmMobileView('form')">Form</button>
      <button class="tab-btn" id="subAdmLogsBtn" onclick="switchAdmMobileView('logs')">Logs History</button>
    </div>

    <div class="row g-3">
      <div class="col-lg-5" id="admFormCol">
        <div class="custom-card">
          <div class="form-section-title"><i class="bi bi-pencil-square"></i> New ADM Entry</div>
          <form id="monitoringForm">
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label">Activity Date</label>
                <input type="date" class="form-control" id="activityDate" required>
              </div>
              <div class="col-6">
                <label class="form-label">Schedule</label>
                <select class="form-select" id="timeSchedule" required>
                  <option value="" disabled selected>Select</option>
                  <option value="7:00 AM - 8:00 AM">7:00 AM - 8:00 AM</option>
                  <option value="8:00 AM - 9:00 AM">8:00 AM - 9:00 AM</option>
                  <option value="9:00 AM - 10:00 AM">9:00 AM - 10:00 AM</option>
                  <option value="10:00 AM - 11:00 AM">10:00 AM - 11:00 AM</option>
                  <option value="1:30 PM - 2:30 PM">1:30 PM - 2:30 PM</option>
                </select>
              </div>
            </div>

            <div class="mb-2">
              <label class="form-label">Teacher Name (Last, First M.I.)</label>
              <input type="text" class="form-control" id="teacherName" placeholder="Dela Cruz, Juan B." required>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label">Subject</label>
                <select class="form-select" id="subject" required>
                  <option value="" disabled selected>Select</option>
                  <option value="Filipino">Filipino</option>
                  <option value="English">English</option>
                  <option value="Mathematics">Mathematics</option>
                  <option value="Science">Science</option>
                  <option value="AP">AP</option>
                  <option value="TLE">TLE</option>
                  <option value="MAPEH">MAPEH</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label">Section</label>
                <input type="text" class="form-control" id="gradeSection" placeholder="10 - Rizal" required>
              </div>
            </div>

            <div class="mb-2">
              <label class="form-label">Total Enrollment</label>
              <input type="number" class="form-control" id="enrollment" value="40" required>
            </div>

            <div class="mb-2">
              <label class="form-label">Activity / Topic</label>
              <textarea class="form-control" id="activity" rows="2" required></textarea>
            </div>

            <div class="p-2 mb-2 rounded" style="background:#f8fafc; border:1px dashed #cbd5e1;">
              <div class="row g-2">
                <div class="col-6"><label class="small text-success">Modular</label><input type="number" class="form-control" id="modular" value="0"></div>
                <div class="col-6"><label class="small text-primary">Online</label><input type="number" class="form-control" id="online" value="0"></div>
                <div class="col-6"><label class="small text-warning">No Resp.</label><input type="number" class="form-control" id="noResponse" value="0"></div>
                <div class="col-6"><label class="small text-danger">Excused</label><input type="number" class="form-control" id="excused" value="0"></div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">MOV Drive Link</label>
              <input type="url" class="form-control" id="movLink" placeholder="https://drive.google.com/..." required>
            </div>

            <button type="submit" class="btn btn-custom-blue w-100" id="admSubmitBtn">Submit ADM Record</button>
          </form>
        </div>
      </div>

      <div class="col-lg-7 d-none d-lg-block" id="admLogsCol">
        <div class="custom-card">
          <div class="form-section-title"><i class="bi bi-table"></i> Monitoring Records</div>
          <div id="admLogsContainer">Loading logs...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODULE 2: TEACHER ATTENDANCE -->
  <div id="teacherTabContent" class="d-none">
    <div class="sub-nav-tabs d-flex d-lg-none">
      <button class="tab-btn active" id="subAttFormBtn" onclick="switchAttMobileView('form')">Clock In/Out</button>
      <button class="tab-btn" id="subAttLogsBtn" onclick="switchAttMobileView('logs')">Attendance Logs</button>
    </div>

    <div class="row g-3">
      <div class="col-lg-5" id="attFormCol">
        <div class="custom-card">
          <div class="form-section-title"><i class="bi bi-alarm"></i> Teacher Time In / Out</div>
          
          <div class="digital-clock-box">
            <div class="digital-clock-time" id="clockTime">00:00:00 AM</div>
            <div class="small text-light" id="clockDate">Loading date...</div>
          </div>

          <form id="attendanceForm">
            <div class="mb-3">
              <label class="form-label">Teacher Name (Last, First M.I.)</label>
              <input type="text" class="form-control" id="attTeacherName" placeholder="Solajes, Alfred B." required>
            </div>
            <div class="mb-3">
              <label class="form-label">Activity Lesson Drive Link</label>
              <input type="url" class="form-control" id="attDriveLink" placeholder="https://drive.google.com/..." required>
            </div>
            <div class="row g-2">
              <div class="col-6"><button type="button" class="btn btn-time-in w-100" onclick="submitAttendance('TIME IN')">TIME IN</button></div>
              <div class="col-6"><button type="button" class="btn btn-time-out w-100" onclick="submitAttendance('TIME OUT')">TIME OUT</button></div>
            </div>
          </form>
        </div>
      </div>

      <div class="col-lg-7 d-none d-lg-block" id="attLogsCol">
        <div class="custom-card">
          <div class="form-section-title"><i class="bi bi-clock-history"></i> Attendance History</div>
          <div id="attLogsContainer">Loading logs...</div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Custom Pop-Up Modal Window -->
<div class="modal fade" id="statusModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered modal-sm px-3">
    <div class="modal-content modal-content-custom text-center p-3">
      <div class="modal-body p-2">
        <div id="modalIconContainer" class="modal-status-icon-wrapper modal-icon-success">
          <i id="modalIcon" class="bi bi-check-circle-fill fs-1"></i>
        </div>
        <h5 class="fw-bold text-dark mb-2" id="modalTitle">TIME IN Recorded Successfully!</h5>
        <p class="text-secondary small mb-3" id="modalMessage">Your attendance log has been recorded.</p>
        <button type="button" class="btn btn-custom-blue w-100 py-2 fs-6" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwBPp0OEwbTt0VYVjckXOV-CrBQY3CPDH2R6tfPrLyZSNPQvEKN6HbdwT_yFWDfpTyG/exec";
  let statusModal;

  function updateClock() {
    const clockTimeEl = document.getElementById('clockTime');
    const clockDateEl = document.getElementById('clockDate');
    if (clockTimeEl && clockDateEl) {
      const now = new Date();
      clockTimeEl.innerText = now.toLocaleTimeString();
      clockDateEl.innerText = now.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
    }
  }
  setInterval(updateClock, 1000); updateClock();

  document.addEventListener('DOMContentLoaded', () => {
    statusModal = new bootstrap.Modal(document.getElementById('statusModal'));
    const dateInput = document.getElementById('activityDate');
    if (dateInput) dateInput.value = new Date().toISOString().split('T')[0];
    loadAdmLogs();
    loadAttLogs();
  });

  function showCustomModal(title, message, isSuccess = true) {
    const titleEl = document.getElementById('modalTitle');
    const msgEl = document.getElementById('modalMessage');
    const iconContainer = document.getElementById('modalIconContainer');
    const icon = document.getElementById('modalIcon');

    titleEl.innerText = title;
    msgEl.innerText = message;

    if (isSuccess) {
      iconContainer.className = "modal-status-icon-wrapper modal-icon-success";
      icon.className = "bi bi-check-circle-fill fs-1";
    } else {
      iconContainer.className = "modal-status-icon-wrapper modal-icon-error";
      icon.className = "bi bi-exclamation-triangle-fill fs-1";
    }

    statusModal.show();
  }

  function switchMainTab(tab) {
    if(tab==='adm') {
      document.getElementById('admTabContent').classList.remove('d-none');
      document.getElementById('teacherTabContent').classList.add('d-none');
      document.getElementById('tabAdmBtn').classList.add('active');
      document.getElementById('tabTeacherBtn').classList.remove('active');
      loadAdmLogs();
    } else {
      document.getElementById('admTabContent').classList.add('d-none');
      document.getElementById('teacherTabContent').classList.remove('d-none');
      document.getElementById('tabAdmBtn').classList.remove('active');
      document.getElementById('tabTeacherBtn').classList.add('active');
      loadAttLogs();
    }
  }

  function switchAdmMobileView(v) {
    document.getElementById('admFormCol').classList.toggle('d-none', v!=='form');
    document.getElementById('admLogsCol').classList.toggle('d-none', v!=='logs');
    document.getElementById('admLogsCol').classList.remove('d-lg-block');
    document.getElementById('subAdmFormBtn').classList.toggle('active', v==='form');
    document.getElementById('subAdmLogsBtn').classList.toggle('active', v==='logs');
    if (v === 'logs') loadAdmLogs();
  }

  function switchAttMobileView(v) {
    document.getElementById('attFormCol').classList.toggle('d-none', v!=='form');
    document.getElementById('attLogsCol').classList.toggle('d-none', v!=='logs');
    document.getElementById('attLogsCol').classList.remove('d-lg-block');
    document.getElementById('subAttFormBtn').classList.toggle('active', v==='form');
    document.getElementById('subAttLogsBtn').classList.toggle('active', v==='logs');
    if (v === 'logs') loadAttLogs();
  }

  // Submit ADM Form
  document.getElementById('monitoringForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('admSubmitBtn');
    btn.disabled = true; btn.innerText = "Submitting...";

    const payload = {
      action: "submitADM",
      data: {
        activityDate: document.getElementById('activityDate').value,
        timeSchedule: document.getElementById('timeSchedule').value,
        teacherName: document.getElementById('teacherName').value,
        subject: document.getElementById('subject').value,
        gradeSection: document.getElementById('gradeSection').value,
        enrollment: document.getElementById('enrollment').value,
        activity: document.getElementById('activity').value,
        modular: document.getElementById('modular').value,
        online: document.getElementById('online').value,
        noResponse: document.getElementById('noResponse').value,
        excused: document.getElementById('excused').value,
        movLink: document.getElementById('movLink').value
      }
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      showCustomModal("Record Submitted!", "ADM Activity entry recorded successfully.");
      document.getElementById('monitoringForm').reset();
      btn.disabled = false; btn.innerText = "Submit ADM Record";
      setTimeout(loadAdmLogs, 1200);
      if (window.innerWidth < 992) switchAdmMobileView('logs');
    })
    .catch(err => {
      showCustomModal("Submission Failed", "Unable to log ADM entry.", false);
      btn.disabled = false; btn.innerText = "Submit ADM Record";
    });
  });

  // Submit Attendance (TIME IN / TIME OUT)
  function submitAttendance(type) {
    const tName = document.getElementById('attTeacherName').value.trim();
    const link = document.getElementById('attDriveLink').value.trim();

    if (!tName || !link) {
      showCustomModal("Missing Information", "Please fill in Teacher Name and Drive Link.", false);
      return;
    }

    const payload = {
      action: "submitAttendance",
      data: { logType: type, teacherName: tName, driveLink: link }
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      showCustomModal(type + " Recorded Successfully!", "Record saved for " + tName + ".", true);
      document.getElementById('attendanceForm').reset();
      setTimeout(loadAttLogs, 1200);
      if (window.innerWidth < 992) switchAttMobileView('logs');
    })
    .catch(err => {
      showCustomModal("Error", "Could not record attendance. Please try again.", false);
    });
  }

  // Load ADM Logs
  function loadAdmLogs() {
    const c = document.getElementById('admLogsContainer');
    c.innerHTML = '<div class="text-muted text-center py-3"><div class="spinner-border spinner-border-sm me-2"></div>Loading logs...</div>';

    fetch(SCRIPT_URL + "?action=getADM")
      .then(r => r.json())
      .then(data => {
        if(!data || !data.length) {
          c.innerHTML = '<div class="text-muted text-center py-3">No logs found.</div>';
          return;
        }
        c.innerHTML = data.map(r => `
          <div class="record-card">
            <div class="d-flex justify-content-between"><strong>${r.teacherName || ''}</strong><span class="badge bg-primary">${r.subject || ''}</span></div>
            <div class="small text-muted mb-2">${r.activityDate || ''} (${r.timeSchedule || ''}) - ${r.gradeSection || ''}</div>
            <a href="${r.movLink || '#'}" target="_blank" class="btn btn-sm btn-outline-primary w-100">View MOV Drive Link</a>
          </div>
        `).join('');
      })
      .catch(() => {
        c.innerHTML = '<div class="text-muted text-center py-3">Unable to load logs right now.</div>';
      });
  }

  // Load Attendance Logs
  function loadAttLogs() {
    const c = document.getElementById('attLogsContainer');
    c.innerHTML = '<div class="text-muted text-center py-3"><div class="spinner-border spinner-border-sm me-2"></div>Loading attendance logs...</div>';

    fetch(SCRIPT_URL + "?action=getAttendance")
      .then(r => r.json())
      .then(data => {
        if(!data || !data.length) {
          c.innerHTML = '<div class="text-muted text-center py-3">No attendance logs available.</div>';
          return;
        }
        c.innerHTML = data.map(r => `
          <div class="record-card border-start border-4 ${r.logType==='TIME IN'?'border-success':'border-danger'}">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <strong>${r.teacherName || ''}</strong>
              <span class="badge ${r.logType==='TIME IN'?'bg-success':'bg-danger'}">${r.logType || ''}</span>
            </div>
            <div class="small text-muted mb-2"><i class="bi bi-clock me-1"></i>${r.timestamp || ''}</div>
            <a href="${r.driveLink || '#'}" target="_blank" class="btn btn-sm btn-light border text-primary w-100">
              Open Activity Link
            </a>
          </div>
        `).join('');
      })
      .catch(() => {
        c.innerHTML = '<div class="text-muted text-center py-3">Unable to load attendance logs.</div>';
      });
  }
</script>
</body>
</html>
